<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>任务同步台</title>
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="任务台">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --primary:#4F46E5;--primary-light:#EEF2FF;--primary-dark:#4338CA;
    --p0:#EF4444;--p0-bg:#FEF2F2;--p1:#F59E0B;--p1-bg:#FFFBEB;--p2:#3B82F6;--p2-bg:#EFF6FF;
    --done:#9CA3AF;--text:#1F2937;--text-light:#6B7280;--border:#E5E7EB;
    --bg:#F8FAFC;--card:#FFFFFF;--danger:#DC2626;--success:#16A34A;
    --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --shadow-md:0 4px 12px rgba(0,0,0,.08);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;
    padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:16px 16px 40px}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#7C3AED);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--text-light)}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-light);padding:5px 10px;background:var(--card);border-radius:20px;border:1px solid var(--border);transition:.15s;white-space:nowrap;cursor:pointer;user-select:none}
  .sync-badge:hover{opacity:1!important}
  .sync-badge.synced{color:var(--success);border-color:#BBF7D0;background:#F0FDF4}
  .sync-badge.syncing{color:var(--primary);border-color:#C7D2FE;animation:pulse 1.5s ease infinite}
  .sync-badge.syncing svg{animation:spin 0.8s linear infinite}
  .sync-badge.off{opacity:.5}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  .btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:9px;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;min-height:38px}
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn svg{width:16px;height:16px;flex-shrink:0}
  .btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-dark);color:#fff}
  .btn-danger{color:var(--danger);border-color:#FCA5A5}
  .btn-danger:hover{background:var(--p0-bg);color:var(--danger);border-color:var(--danger)}
  .btn-sm{height:32px;padding:0 10px;font-size:13px;min-height:32px}
  /* 备份提示 */
  .backup-tip{display:none;background:var(--p1-bg);border:1px solid #FDE68A;color:#92400E;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;align-items:center;gap:8px}
  .backup-tip.show{display:flex}
  .backup-tip svg{width:18px;height:18px;flex-shrink:0}
  /* 今天要处理 */
  .today-box{background:linear-gradient(135deg,#FFF,#FFFBEB);border:1px solid #FDE68A;border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
  .today-box .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .today-box .hd .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .today-box .hd .t svg{width:20px;height:20px;color:var(--p1)}
  .today-box .cnt{font-size:13px;color:var(--text-light);background:#FEF3C7;padding:2px 8px;border-radius:20px;font-weight:600}
  .today-list{display:flex;flex-direction:column;gap:8px}
  .today-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:9px;padding:10px 12px;border-left:4px solid var(--p2)}
  .today-item.overdue{border-left-color:var(--danger);background:var(--p0-bg)}
  .today-item .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
  .tag.overdue{background:var(--danger);color:#fff}
  .tag.today{background:var(--p1);color:#fff}
  .tag.soon{background:var(--p2);color:#fff}
  .today-item .tt{flex:1;font-size:14px;line-height:1.4}
  .today-item.overdue .tt{color:var(--danger);font-weight:600}
  .today-item .do{flex-shrink:0}
  .today-empty{text-align:center;color:var(--text-light);font-size:14px;padding:14px}
  /* 布局 */
  .layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .card .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
  .card .hd .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .card .hd .t svg{width:18px;height:18px;color:var(--primary)}
  .card .bd{padding:14px 16px}
  /* 录入 */
  .add-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .add-form input[type=text]{flex:1;min-width:160px;height:44px;padding:0 12px;border:1.5px solid var(--border);border-radius:9px;font-size:16px;font-family:inherit;background:#fff;transition:.15s}
  .add-form input[type=text]:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
  .sel{height:44px;border:1.5px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;padding:0 10px;cursor:pointer}
  .sel:focus{outline:none;border-color:var(--primary)}
  .date-in{height:44px;border:1.5px solid var(--border);border-radius:9px;font-size:15px;font-family:inherit;background:#fff;padding:0 10px;cursor:pointer}
  .add-btn{height:44px;padding:0 16px;background:var(--primary);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .add-btn:hover{background:var(--primary-dark)}
  .add-btn svg{width:18px;height:18px}
  /* 筛选 */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{height:32px;padding:0 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-light);transition:.15s;display:inline-flex;align-items:center;gap:5px}
  .chip:hover{border-color:var(--primary)}
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
  /* 任务列表 */
  .task-list{display:flex;flex-direction:column;gap:8px}
  .task{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:.2s;position:relative}
  .task:hover{box-shadow:var(--shadow-md);border-color:#CBD5E1}
  .task.highlight{animation:glow 1.6s ease}
  @keyframes glow{0%,100%{box-shadow:var(--shadow)}25%{box-shadow:0 0 0 3px var(--primary),0 8px 20px rgba(79,70,229,.25)}50%{box-shadow:0 0 0 3px var(--primary),0 8px 20px rgba(79,70,229,.25)}}
  .check{width:24px;height:24px;border-radius:7px;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:.15s;background:#fff}
  .check:hover{border-color:var(--primary)}
  .check.done{background:var(--success);border-color:var(--success)}
  .check.done svg{display:block}
  .check svg{width:14px;height:14px;color:#fff;display:none}
  .task-body{flex:1;min-width:0}
  .task-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pri{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;flex-shrink:0}
  .pri.p0{background:var(--p0);color:#fff}
  .pri.p1{background:var(--p1);color:#fff}
  .pri.p2{background:var(--p2);color:#fff}
  .task .tt{font-size:15px;font-weight:500;line-height:1.4;word-break:break-word}
  .task .due{font-size:12px;color:var(--text-light)}
  .task .due.overdue{color:var(--danger);font-weight:600}
  .task .src{font-size:11px;color:var(--primary);background:var(--primary-light);padding:1px 6px;border-radius:5px;font-weight:600}
  .task.done .tt{text-decoration:line-through;color:var(--done)}
  .task.done .pri{opacity:.5}
  .task .del{position:absolute;top:8px;right:8px;width:26px;height:26px;border:none;background:transparent;color:var(--text-light);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s}
  .task:hover .del{opacity:1}
  .task .del:hover{background:var(--p0-bg);color:var(--danger)}
  .task .del svg{width:15px;height:15px}
  .task-empty{text-align:center;padding:30px 16px;color:var(--text-light)}
  .task-empty svg{width:42px;height:42px;color:#D1D5DB;margin-bottom:8px}
  /* 看板 */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .stat{background:var(--primary-light);border-radius:10px;padding:12px;text-align:center}
  .stat .n{font-size:26px;font-weight:800;color:var(--primary);line-height:1.1}
  .stat .l{font-size:12px;color:var(--text-light);margin-top:2px}
  .ring-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
  .ring-wrap .lbl{font-size:13px;color:var(--text-light);margin-top:6px}
  .pie-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0}
  .pie-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;width:100%}
  .pie-leg{display:flex;align-items:center;justify-content:space-between;font-size:13px}
  .pie-leg .lf{display:flex;align-items:center;gap:7px}
  .dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
  .pie-leg .v{font-weight:700}
  /* toast */
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(100px);background:#1F2937;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999;opacity:0;transition:.3s;max-width:90vw;display:flex;align-items:center;gap:10px}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .toast svg{width:18px;height:18px;flex-shrink:0}
  .toast .next{color:#A5B4FC;font-weight:600}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
  .modal h3{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .modal h3 svg{width:20px;height:20px;color:var(--danger)}
  .modal p{font-size:14px;color:var(--text-light);margin-bottom:18px;line-height:1.6}
  .modal .acts{display:flex;gap:10px;justify-content:flex-end}
  .hidden{display:none!important}
  /* 移动端调整 */
  @media(max-width:520px){
    .wrap{padding:12px 12px 32px}
    .brand h1{font-size:16px}
    .btn{padding:0 11px;font-size:13px}
    .add-form input[type=text]{font-size:16px}
    .stat .n{font-size:22px}
    .task{padding:11px 12px}
    .task .del{opacity:.6}
  }
  .footer-note{text-align:center;color:var(--text-light);font-size:12px;margin-top:20px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <!-- 顶栏 -->
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" width="22" height="22"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z" fill="#fff"/></svg>
      </div>
      <div>
        <h1><!--APP_TITLE-->任务台</h1>
        <!--APP_SUBTITLE-->
      </div>
    </div>
    <div class="actions">
      <div class="sync-badge off" id="syncBadge">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z" fill="currentColor"/></svg>
        <span id="syncText">等待同步</span>
      </div>
      <button class="btn btn-sm" id="btnExport" title="导出JSON备份">
        <svg viewBox="0 0 24 24" fill="none"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/></svg>
        导出备份
      </button>
      <label class="btn btn-sm" title="导入恢复">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2v2h14v-2H5z" fill="currentColor"/></svg>
        导入恢复
        <input type="file" id="fileImport" accept="application/json,.json" class="hidden">
      </label>
      <button class="btn btn-sm btn-danger" id="btnClear" title="清空全部数据">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3l-1-1H9L8 4H5v2h14V4z" fill="currentColor"/></svg>
        清空
      </button>
    </div>
  </div>

  <!-- 备份提示 -->
  <div class="backup-tip" id="backupTip">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z" fill="currentColor"/></svg>
    <span>数据已积累 <b id="tipCount">0</b> 条，建议导出一份备份存在本地，防丢失。</span>
  </div>

  <!-- 今天要处理 -->
  <div class="today-box">
    <div class="hd">
      <div class="t">
        <svg viewBox="0 0 24 24" fill="none"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" fill="currentColor"/></svg>
        今天要处理
      </div>
      <span class="cnt" id="todayCount">0 项</span>
    </div>
    <div class="today-list" id="todayList"></div>
  </div>

  <!-- 布局 -->
  <div class="layout">
    <!-- 左：任务清单 -->
    <div class="card">
      <div class="hd">
        <div class="t">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 5v14h18V5H3zm16 12H5V7h14v10zM7 9h5v5H7V9z" fill="currentColor"/></svg>
          任务清单
        </div>
      </div>
      <div class="bd">
        <!-- 录入 -->
        <form class="add-form" id="addForm" autocomplete="off">
          <input type="text" id="taskInput" placeholder="输入任务，如：整理本周项目周报…" required>
          <select class="sel" id="priSel" title="优先级">
            <option value="P0">P0 紧急</option>
            <option value="P1" selected>P1 较高</option>
            <option value="P2">P2 普通</option>
          </select>
          <input type="date" class="date-in" id="dueInput" title="截止日期">
          <button type="submit" class="add-btn">
            <svg viewBox="0 0 24 24" fill="none"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="#fff"/></svg>
            添加
          </button>
        </form>
        <!-- 筛选 -->
        <div class="filters" id="filters">
          <button class="chip active" data-filter="all">全部</button>
          <button class="chip" data-filter="pending">待办</button>
          <button class="chip" data-filter="done">已完成</button>
          <button class="chip" data-filter="P0">P0</button>
          <button class="chip" data-filter="P1">P1</button>
          <button class="chip" data-filter="P2">P2</button>
        </div>
        <!-- 列表 -->
        <div class="task-list" id="taskList"></div>
      </div>
    </div>

    <!-- 右：进度看板 -->
    <div class="card">
      <div class="hd">
        <div class="t">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" fill="currentColor"/></svg>
          进度看板
        </div>
      </div>
      <div class="bd">
        <div class="stat-grid">
          <div class="stat"><div class="n" id="statDone">0</div><div class="l">今日已完成</div></div>
          <div class="stat"><div class="n" id="statWeek">0</div><div class="l">本周完成</div></div>
        </div>
        <div class="ring-wrap">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="58" fill="none" stroke="#E5E7EB" stroke-width="12"/>
            <circle id="ring" cx="70" cy="70" r="58" fill="none" stroke="#4F46E5" stroke-width="12" stroke-linecap="round" transform="rotate(-90 70 70)" stroke-dasharray="0 364.4"/>
            <text id="ringTxt" x="70" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="#1F2937">0%</text>
            <text x="70" y="86" text-anchor="middle" font-size="11" fill="#6B7280">今日完成率</text>
          </svg>
        </div>
        <div class="pie-wrap">
          <div style="font-size:13px;font-weight:700;margin-bottom:6px;align-self:flex-start">优先级分布（待办）</div>
          <svg width="150" height="150" viewBox="0 0 150 150" id="pieSvg">
            <circle cx="75" cy="75" r="55" fill="none" stroke="#E5E7EB" stroke-width="22"/>
          </svg>
          <div class="pie-legend" id="pieLegend"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-note">
    数据保存在本浏览器，刷新关闭不丢失 · 建议定期「导出备份」<br>
    钉钉/飞书任务自动同步 · 做完一个划一个
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<!-- 清空确认弹窗 -->
<div class="mask" id="clearMask">
  <div class="modal">
    <h3>
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z" fill="currentColor"/></svg>
      确认清空全部数据？
    </h3>
    <p>这将删除所有任务记录，且无法恢复。建议先「导出备份」再清空。确认要继续吗？</p>
    <div class="acts">
      <button class="btn btn-sm" id="cancelClear">取消</button>
      <button class="btn btn-sm btn-danger" id="confirmClear">确认清空</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY="wb_tasksync_tasks";
  var TODAY=(function(){var d=new Date();d.setHours(0,0,0,0);return d;})();
  var TODAY_STR=fmtDate(TODAY);

  // ===== 工具函数 =====
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function fmtDate(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+da;}
  function parseDate(s){if(!s)return null;var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
  function fmtDisplay(s){if(!s)return '';var p=s.split('-');return p[1]+'月'+p[2]+'日';}
  function daysBetween(a,b){return Math.round((parseDate(a)-b)/86400000);}
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];}}
  function save(t){localStorage.setItem(KEY,JSON.stringify(t));}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  // ===== 初始示例数据（首次打开） =====

      {id:uid(),title:'跟进去周会议上确定的方案落地情况',priority:'P1',due:TODAY_STR,status:'pending',createdAt:TODAY_STR,src:'示例'},
      {id:uid(),title:'准备周五客户演示材料（PPT+Demo环境）',priority:'P1',due:TODAY_STR,status:'pending',createdAt:TODAY_STR,src:'示例'},
      {id:uid(),title:'协调技术部完成接口联调测试',priority:'P2',due:tom,status:'pending',createdAt:TODAY_STR,src:'示例'},

  // ===== DOM =====
  var $=function(s){return document.querySelector(s);};
  var taskListEl=$('#taskList'),todayListEl=$('#todayList'),toastEl=$('#toast');
  var filter='all';

  // ===== 渲染任务列表 =====
  function getFiltered(){
    var t=load();
    if(filter==='all')return t;
    if(filter==='pending')return t.filter(function(x){return x.status==='pending';});
    if(filter==='done')return t.filter(function(x){return x.status==='done';});
    return t.filter(function(x){return x.priority===filter;});
  }

  function renderList(){
    var arr=getFiltered();
    // 排序：未完成在前，按优先级P0>P1>P2，再按截止日期
    var priOrder={P0:0,P1:1,P2:2};
    arr.sort(function(a,b){
      if(a.status!==b.status)return a.status==='pending'?-1:1;
      if(a.priority!==b.priority)return priOrder[a.priority]-priOrder[b.priority];
      var da=a.due||'9999',db=b.due||'9999';return da<db?-1:1;
    });
    if(arr.length===0){
      var emptyMsg=filter==='all'?'还没有任务，先添加一条试试':'该筛选下没有任务';
      taskListEl.innerHTML='<div class="task-empty"><svg viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" fill="currentColor"/></svg><div>'+emptyMsg+'</div></div>';
      return;
    }
    var html=arr.map(function(t){
      var done=t.status==='done';
      var dueCls='';
      var dueTxt=t.due?fmtDisplay(t.due):'无截止';
      if(t.due&&!done){var diff=daysBetween(t.due,TODAY);if(diff<0){dueCls='overdue';dueTxt='逾期 '+fmtDisplay(t.due);}else if(diff===0){dueTxt='今天到期';}else if(diff<=2){dueTxt=diff+'天后 ('+fmtDisplay(t.due)+')';}}
      var srcTag=t.src?'<span class="src">'+esc(t.src)+'</span>':'';
      return '<div class="task'+(done?' done':'')+'" data-id="'+t.id+'">'+
        '<div class="check'+(done?' done':'')+'" data-act="toggle"><svg viewBox="0 0 24 24" fill="none"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="currentColor"/></svg></div>'+
        '<div class="task-body">'+
          '<div class="task-row">'+
            '<span class="pri '+t.priority.toLowerCase()+'">'+t.priority+'</span>'+
            srcTag+
            '<span class="tt">'+esc(t.title)+'</span>'+
          '</div>'+
          '<div class="due'+dueCls+'">'+dueTxt+(done&&t.doneAt?' · 完成':'')+'</div>'+
        '</div>'+
        '<button class="del" data-act="del" title="删除"><svg viewBox="0 0 24 24" fill="none"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3l-1-1H9L8 4H5v2h14V4z" fill="currentColor"/></svg></button>'+
      '</div>';
    }).join('');
    taskListEl.innerHTML=html;
  }

  // ===== 渲染今天要处理 =====
  function renderToday(){
    var t=load().filter(function(x){return x.status==='pending';});
    var items=[];
    t.forEach(function(x){
      if(!x.due)return;
      var diff=daysBetween(x.due,TODAY);
      if(diff<0){
        items.push({t:x,type:'overdue',label:'逾期',sort:0});
      }else if(diff===0){
        items.push({t:x,type:'today',label:'今日',sort:1});
      }else if(diff<=2){
        items.push({t:x,type:'soon',label:diff+'天后',sort:2+diff});
      }
    });
    items.sort(function(a,b){return a.sort-b.sort;});
    $('#todayCount').textContent=items.length+' 项';
    if(items.length===0){
      todayListEl.innerHTML='<div class="today-empty">今天没有逾期或近期到期的任务，状态不错 👍</div>';
      return;
    }
    todayListEl.innerHTML=items.map(function(it){
      return '<div class="today-item '+(it.type==='overdue'?'overdue':'')+'" data-id="'+it.t.id+'">'+
        '<span class="tag '+it.type+'">'+it.label+'</span>'+
        '<span class="tt">'+esc(it.t.title)+'</span>'+
        '<button class="btn btn-sm do" data-tid="'+it.t.id+'" data-act="do-today">处理</button>'+
      '</div>';
    }).join('');
  }

  // ===== 渲染看板 =====
  function renderStats(){
    var t=load();
    var todayPending=t.filter(function(x){return x.status==='pending'&&x.due===TODAY_STR;});
    var todayDone=t.filter(function(x){return x.status==='done'&&x.doneAt&&x.doneAt.slice(0,10)===TODAY_STR;});
    var todayTotal=todayPending.length+todayDone.length;
    var rate=todayTotal>0?Math.round(todayDone.length/todayTotal*100):0;
    $('#statDone').textContent=todayDone.length;
    // 本周完成
    var wkStart=new Date(TODAY);var wd=TODAY.getDay();wd=wd===0?6:wd-1;wkStart.setDate(TODAY.getDate()-wd);
    var weekDone=t.filter(function(x){return x.status==='done'&&x.doneAt&&parseDate(x.doneAt.slice(0,10))>=wkStart;});
    $('#statWeek').textContent=weekDone.length;
    // 环形
    var circ=2*Math.PI*58;var dash=rate/100*circ;
    var ring=$('#ring');ring.setAttribute('stroke-dasharray',dash+' '+circ);
    $('#ringTxt').textContent=rate+'%';
    // 优先级分布饼图（待办）
    var pending=t.filter(function(x){return x.status==='pending';});
    var p0=pending.filter(function(x){return x.priority==='P0';}).length;
    var p1=pending.filter(function(x){return x.priority==='P1';}).length;
    var p2=pending.filter(function(x){return x.priority==='P2';}).length;
    var total=p0+p1+p2;
    var pie=$('#pieSvg');
    var colors={P0:'#EF4444',P1:'#F59E0B',P2:'#3B82F6'};
    var segs=[{k:'P0',n:p0},{k:'P1',n:p1},{k:'P2',n:p2}];
    // 清除旧扇形
    pie.querySelectorAll('path').forEach(function(n){n.remove();});
    if(total===0){
      pie.innerHTML='<circle cx="75" cy="75" r="55" fill="none" stroke="#E5E7EB" stroke-width="22"/>';
    }else{
      var svgNS='http://www.w3.org/2000/svg';
      var r=55,cx=75,cy=75;
      var start=-90;
      segs.forEach(function(s){
        if(s.n===0)return;
        var ang=s.n/total*360;
        var end=start+ang;
        var x1=cx+r*Math.cos(start*Math.PI/180),y1=cy+r*Math.sin(start*Math.PI/180);
        var x2=cx+r*Math.cos(end*Math.PI/180),y2=cy+r*Math.sin(end*Math.PI/180);
        var large=ang>180?1:0;
        var path=document.createElementNS(svgNS,'path');
        path.setAttribute('d','M'+cx+','+cy+' L'+x1.toFixed(2)+','+y1.toFixed(2)+' A'+r+','+r+' 0 '+large+' 1 '+x2.toFixed(2)+','+y2.toFixed(2)+' Z');
        path.setAttribute('fill',colors[s.k]);
        pie.appendChild(path);
        start=end;
      });
    }
    // 图例
    var leg=$('#pieLegend');
    leg.innerHTML=segs.map(function(s){
      return '<div class="pie-leg"><div class="lf"><span class="dot" style="background:'+colors[s.k]+'"></span>'+s.k+'</div><span class="v">'+s.n+'</span></div>';
    }).join('');
  }

  // ===== 备份提示 =====

  // ===== toast =====
  var toastTimer=null;
  function toast(msg,withNext,nextTitle){
    toastEl.innerHTML='<svg viewBox="0 0 24 24" fill="none"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="#4ADE80"/></svg>'+
      '<span>'+msg+'</span>'+
      (withNext?'<span class="next">下一个：'+esc(nextTitle)+'</span>':'');
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},3200);
  }

  // ===== 完成任务 + 提示下一个 =====
  function completeTask(id){
    var t=load();
    var doneItem=null;
    t=t.map(function(x){if(x.id===id){x.status='done';x.doneAt=new Date().toISOString();doneItem=x;}return x;});
    save(t);
    renderAll();
    // 找下一个待办
    var next=t.filter(function(x){return x.status==='pending';})
      .sort(function(a,b){var po={P0:0,P1:1,P2:2};if(a.priority!==b.priority)return po[a.priority]-po[b.priority];var da=a.due||'9999',db=b.due||'9999';return da<db?-1:1;})[0];
    if(next){
      toast('完成一个！',true,next.title);
      // 滚动并高亮
      setTimeout(function(){
        var el=taskListEl.querySelector('.task[data-id="'+next.id+'"]');
        if(el){
          el.scrollIntoView({behavior:'smooth',block:'center'});
          el.classList.add('highlight');
          setTimeout(function(){el.classList.remove('highlight');},1700);
        }
      },250);
    }else{
      toast('全部完成！今天的任务清空了 🎉',false,'');
    }
  }

  function reopenTask(id){
    var t=load();
    t=t.map(function(x){if(x.id===id){x.status='pending';delete x.doneAt;}return x;});
    save(t);renderAll();
    toast('已恢复为待办',false,'');
  }

  function deleteTask(id){
    var t=load().filter(function(x){return x.id!==id;});
    save(t);renderAll();
  }

  $('#addForm').addEventListener('submit',function(e){

  // ===== 桌面气泡提醒（长时间未操作时提示未完成任务）=====
  (function(){
    if(!('Notification' in window)) return;
    var IDLE_MS=25*60*1000;   // 25分钟无任何交互触发
    var GAP_MS=25*60*1000;    // 两次提醒最少间隔25分钟，不轰炸
    var lastActive=Date.now();
    var lastNotified=0;
    function bump(){lastActive=Date.now();}
    ['mousemove','click','keydown','scroll','touchstart','focus','resize'].forEach(function(ev){
      document.addEventListener(ev,bump,{passive:true});
    });
    function pickNext(arr){
      var po={P0:0,P1:1,P2:2};
      return arr.slice().sort(function(a,b){
        var ao=(a.due&&a.due<TODAY_STR)?1:0,bo=(b.due&&b.due<TODAY_STR)?1:0;
        if(ao!==bo)return bo-ao;
        if(ao&&a.due!==b.due)return a.due<b.due?-1:1;
        var at=(a.due===TODAY_STR)?1:0,bt=(b.due===TODAY_STR)?1:0;
        if(at!==bt)return bt-at;
        if(a.priority!==b.priority)return po[a.priority]-po[b.priority];
        var ad=a.due||'9999',bd=b.due||'9999';
        return ad<bd?-1:1;
      })[0];
    }
    function remind(){
      var idle=Date.now()-lastActive;
      if(idle<IDLE_MS)return;
      if(Date.now()-lastNotified<GAP_MS)return;
      var t=load();
      var pending=t.filter(function(x){return x.status==='pending';});
      if(pending.length===0)return;
      var nt=pickNext(pending);
      var overCount=pending.filter(function(x){return x.due&&x.due<TODAY_STR;}).length;
      var title='📋 任务台 · 还有 '+pending.length+' 项没做完';
      var body='下一个该做：'+(nt?nt.title:'（无）');
      if(overCount>0)body+=' · 其中 '+overCount+' 项已逾期';
      try{
        var n=new Notification(title,{body:body,tag:'ec-task-reminder',silent:false});
        n.onclick=function(){window.focus();n.close();};
      }catch(e){}
      lastNotified=Date.now();
      lastActive=Date.now();
    }
    setInterval(remind,60000);
    function reqPerm(){
      if(Notification.permission==='default'){
        try{Notification.requestPermission();}catch(e){}
      }
      document.removeEventListener('click',reqPerm);
      document.removeEventListener('touchstart',reqPerm);
    }
    document.addEventListener('click',reqPerm);
    document.addEventListener('touchstart',reqPerm);
    window.addEventListener('load',function(){
      if(Notification.permission==='default'){
        var tip=document.createElement('div');
        tip.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#EEF2FF;color:#4338CA;padding:10px 16px;border-radius:8px;font-size:13px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,.12);max-width:90%;text-align:center';
        tip.innerHTML='🔔 点击页面任意处开启「未完成任务气泡提醒」，长时间没操作时会弹窗提示你还有什么没做完';
        tip.onclick=function(){tip.remove();};
        document.body.appendChild(tip);
        setTimeout(function(){if(tip.parentNode)tip.remove();},12000);
      }
    });
  })();

  // ===== DingTalk auto-sync (Electron only) =====
  (function(){
    var SYNC_KEY='wb_tasksync_last_sync';
    var POLL_MS=3*60*1000;

    function getLastBatch(){try{return localStorage.getItem(SYNC_KEY)||'';}catch(e){return '';}}
    function setLastBatch(id){try{localStorage.setItem(SYNC_KEY,id);}catch(e){}}

    function processSyncData(data){
      if(!data||!data.tasks)return;
      var batchId=data.batchId||'';
      if(batchId&&batchId===getLastBatch())return;

      var existing=load();
      var existIds={};
      existing.forEach(function(t){if(t.syncId)existIds[t.syncId]=true;});

      var newTasks=[];
      (data.tasks||[]).forEach(function(task){
        if(task.syncId&&existIds[task.syncId])return;
        newTasks.push({
          id:uid(),
          syncId:task.syncId||('sync_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)),
          title:task.title||'未命名任务',
          priority:task.priority||'P1',
          due:task.due||'',
          status:'pending',
          createdAt:new Date().toISOString(),
          src:task.source?((task.platform==='feishu'?'飞书·':'钉钉·')+task.source):'IM同步'
        });
      });

      if(newTasks.length>0){
        var all=existing.concat(newTasks);
        save(all);
        renderAll();
        toast('从IM同步了 '+newTasks.length+' 条新任务',true,newTasks[0].title);
      }

      if(batchId)setLastBatch(batchId);
      updateSyncUI(data.generatedAt);
    }

    function updateSyncUI(time){
      var badge=document.getElementById('syncBadge');
      var text=document.getElementById('syncText');
      if(!badge||!text)return;
      if(time){
        var t=new Date(time);
        var hh=String(t.getHours()).padStart(2,'0');
        var mm=String(t.getMinutes()).padStart(2,'0');
        text.textContent='已同步 '+hh+':'+mm;
        badge.className='sync-badge synced';
      }else{
        text.textContent='等待同步';
        badge.className='sync-badge off';
      }
    }

    if(window.electronSync){
      try{processSyncData(window.electronSync.getTasks());}catch(e){}
      window.electronSync.onUpdate(function(data){processSyncData(data);});
      setInterval(function(){
        try{processSyncData(window.electronSync.getTasks());}catch(e){}
      },POLL_MS);

      // Listen for sync status updates from main process
      if(window.electronSync.onSyncStatus){
        window.electronSync.onSyncStatus(function(status){
          var badge=document.getElementById('syncBadge');
          var text=document.getElementById('syncText');
          if(!badge||!text)return;

          if(status.status==='syncing'){
            badge.className='sync-badge syncing';
            text.textContent='拉取消息中…';
          }else if(status.status==='done'){
            var summary=status.summary||{};
            var data=status.data||{tasks:[]};
            var before=load().length;
            processSyncData(data);
            var after=load().length;
            var newCount=after-before;

            if(newCount>0){
              toast('从IM同步了 '+newCount+' 条新任务',true);
            }else if(summary.tasksExtracted===0){
              toast('已拉取消息，暂无新任务',true);
            }else{
              toast('同步完成，'+summary.tasksExtracted+'条已在列表中',true);
            }

            if(data.generatedAt){
              updateSyncUI(data.generatedAt);
            }else{
              updateSyncUI(new Date().toISOString());
            }
          }else if(status.status==='error'){
            toast('消息拉取失败: '+(status.message||'未知错误'),false);
            updateSyncUI();
          }
        });
      }

      // Badge click: trigger real DingTalk sync
      var badge=document.getElementById('syncBadge');
      if(badge){
        badge.title='点击拉取最新任务';
        badge.addEventListener('click',function(){
          if(badge.className.indexOf('syncing')>=0)return;
          badge.className='sync-badge syncing';
          var t=document.getElementById('syncText');
          if(t)t.textContent='拉取钉钉中…';

          if(window.electronSync.triggerSync){
            window.electronSync.triggerSync().then(function(result){
              if(!result||!result.success){
                toast('同步失败，请稍后重试',false);
                updateSyncUI();
              }
              // onSyncStatus callback will handle the success case
            }).catch(function(){
              toast('同步失败，请稍后重试',false);
              updateSyncUI();
            });
          }else{
            // Fallback: just re-read local file
            setTimeout(function(){
              try{
                var data=window.electronSync.getTasks();
                processSyncData(data);
                if(data&&data.generatedAt){
                  updateSyncUI(data.generatedAt);
                }else{
                  updateSyncUI();
                }
              }catch(e){
                updateSyncUI();
              }
            },400);
          }
        });
      }
    }else{
      var badge=document.getElementById('syncBadge');
      var text=document.getElementById('syncText');
      if(badge&&text){
        text.textContent='浏览器模式';
        badge.className='sync-badge off';
      }
    }
  })();
})();
</script>
</body>
</html>
